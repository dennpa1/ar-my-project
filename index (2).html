
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ESP32 AR Hand Controller</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

<style>
body {
  margin: 0;
  font-family: sans-serif;
}

#panel {
  position: fixed;
  top: 5px;
  left: 5px;
  z-index: 1000;
  width: 280px;
  max-height: 42vh;
  overflow: auto;
  background: rgba(255,255,255,.95);
  padding: 10px;
  border-radius: 8px;
  font-size: 12px;
}

button {
  padding: 10px;
  background: #1976d2;
  color: white;
  border: none;
  border-radius: 5px;
}
</style>
</head>

<body>

<div id="panel">

  <h3>AR Hand Controller</h3>

  <button id="connect">ESP32接続</button>

  <p id="status">モデル読み込み中</p>

  <p id="boneCount">ボーン確認中</p>

  <details>
    <summary>ボーン一覧</summary>
    <pre id="boneList"></pre>
  </details>

</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  arjs="sourceType:webcam;debugUIEnabled:false;">

<a-marker preset="hiro">

  <a-box
    position="0 0.5 0"
    rotation="0 0 0"
    color="red"
    scale="1 1 1">
  </a-box>

</a-marker>
    

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>

// =================================
// 1. ボーン名設定
// =================================

const BONE_MAP = {
  thumb1: "",
  thumb2: "",
  thumb3: "",

  index1: "",
  index2: "",
  index3: "",

  middle1: "",
  middle2: "",
  middle3: "",

  ring1: "",
  ring2: "",
  ring3: "",

  pinky1: "",
  pinky2: "",
  pinky3: ""
};

// 初期設定はZ軸
// 実際のモデルで方向を確認して調整する

const AXIS = {
  x: 0,
  y: 0,
  z: 1
};

// 関節ごとの回転方向
const DIRECTION = {};

const bones = {};
const baseRotations = {};

let modelReady = false;

// =================================
// 2. 画面表示
// =================================

const status = document.getElementById("status");

function showStatus(message) {
  status.textContent = message;
}

// =================================
// 3. 3Dモデル読み込み
// =================================

const hand = document.getElementById("hand");

hand.addEventListener("model-loaded", () => {

  const model = hand.getObject3D("mesh");

  const allBones = [];

  model.traverse(object => {

    if (object.isBone) {
      allBones.push(object);
    }

  });

  document.getElementById("boneCount").textContent =
    "ボーン数：" + allBones.length;

  document.getElementById("boneList").textContent =
    allBones.map(b => b.name).join("\n");

  // ボーンを登録
  for (const key in BONE_MAP) {

    const name = BONE_MAP[key];

    if (!name) continue;

    const bone = allBones.find(
      b => b.name === name
    );

    if (!bone) {
      console.warn("ボーン未発見:", key, name);
      continue;
    }

    bones[key] = bone;
    baseRotations[key] = bone.quaternion.clone();

  }

  modelReady = true;

  showStatus("3Dモデル読み込み成功");

  console.log("全ボーン:", allBones);
  console.log("登録ボーン:", bones);

});

hand.addEventListener("model-error", () => {
  showStatus("GLB読み込み失敗");
});

// =================================
// 4. 指の角度を反映
// =================================

function updateHand(data) {

  if (!modelReady) return;

  for (const key in BONE_MAP) {

    const bone = bones[key];

    if (!bone) continue;

    if (!Number.isFinite(data[key])) continue;

    // 安全な入力範囲
    const degree = Math.max(
      0,
      Math.min(90, data[key])
    );

    const sign = DIRECTION[key] ?? 1;

    const radian =
      degree * Math.PI / 180 * sign;

    const rotation = new THREE.Quaternion();

    rotation.setFromAxisAngle(
      new THREE.Vector3(
        AXIS.x,
        AXIS.y,
        AXIS.z
      ),
      radian
    );

    bone.quaternion.copy(
      baseRotations[key]
    ).multiply(rotation);

  }

}

// =================================
// 5. USBシリアル通信
// =================================

let port;
let reader;

async function connectESP32() {

  try {

    if (!("serial" in navigator)) {
      showStatus("Web Serial API非対応");
      return;
    }

    port = await navigator.serial.requestPort();

    await port.open({
      baudRate: 115200
    });

    showStatus("ESP32接続成功・受信待機中");

    const decoder = new TextDecoderStream();

    const pipeClosed = port.readable.pipeTo(
      decoder.writable
    );

    reader = decoder.readable.getReader();

    let buffer = "";

    while (true) {

      const result = await reader.read();

      if (result.done) break;

      buffer += result.value;

      const lines = buffer.split("\n");

      buffer = lines.pop();

      for (const line of lines) {

        if (!line.trim()) continue;

        try {

          const data = JSON.parse(line);

          updateHand(data);

        } catch (error) {

          console.warn("JSON解析エラー", error);

        }

      }

    }

    reader.releaseLock();

    await pipeClosed;

  } catch (error) {

    console.error(error);

    showStatus("通信エラー：" + error.message);

  }

}

document.getElementById("connect")
  .addEventListener("click", connectESP32);

</script>

</body>
</html>
